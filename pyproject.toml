[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-field"
version = "0.1.0"
description = "Evaluate visual language model fields as local robot planning interfaces"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
subscription = ["PyJWT[crypto]>=2.10,<3"]

[project.scripts]
gpt-field = "gpt_field.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

