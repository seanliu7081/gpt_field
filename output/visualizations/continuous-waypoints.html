<div id="uc71-continuous-waypoints">
  <style>
    #uc71-continuous-waypoints { color: var(--foreground); }
    #uc71-continuous-waypoints .cw-stack { display: flex; flex-direction: column; gap: calc(var(--font-size-base) * 1); }
    #uc71-continuous-waypoints .cw-heading { display: flex; flex-direction: column; gap: calc(var(--font-size-base) * .5); padding-right: 90px; }
    #uc71-continuous-waypoints .cw-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--font-size-base) * 1); }
    #uc71-continuous-waypoints .cw-control { display: flex; flex-direction: column; gap: calc(var(--font-size-base) * .5); min-width: 0; }
    #uc71-continuous-waypoints .cw-control-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: calc(var(--font-size-base) * .25); }
    #uc71-continuous-waypoints .cw-plot { width: 100%; display: block; overflow: visible; }
    #uc71-continuous-waypoints .cw-plot text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
    #uc71-continuous-waypoints .cw-legend { display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--font-size-base) * 1); }
    #uc71-continuous-waypoints .cw-legend-item { display: inline-flex; align-items: center; gap: calc(var(--font-size-base) * .5); }
    #uc71-continuous-waypoints .cw-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--viz-series-1); }
    #uc71-continuous-waypoints .cw-grid-key { width: 20px; height: 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    @media (max-width: 420px) {
      #uc71-continuous-waypoints .cw-controls { grid-template-columns: 1fr; }
    }
  </style>
  <div class="cw-stack">
    <div class="cw-heading">
      <h3>One waypoint, three coordinates</h3>
      <span class="text-small text-muted">Illustrative world coordinates</span>
    </div>
    <div class="cw-controls">
      <div class="cw-control">
        <div class="cw-control-head"><label class="form-label" for="cw-x">X position</label><output id="cw-x-value" class="tabular-nums" for="cw-x">0.073 m</output></div>
        <input id="cw-x" class="form-range" type="range" min="0" max="0.30" step="0.001" value="0.073" aria-label="Waypoint X in metres">
      </div>
      <div class="cw-control">
        <div class="cw-control-head"><label class="form-label" for="cw-y">Y position</label><output id="cw-y-value" class="tabular-nums" for="cw-y">0.237 m</output></div>
        <input id="cw-y" class="form-range" type="range" min="0" max="0.30" step="0.001" value="0.237" aria-label="Waypoint Y in metres">
      </div>
      <div class="cw-control">
        <div class="cw-control-head"><label class="form-label" for="cw-z">Z height</label><output id="cw-z-value" class="tabular-nums" for="cw-z">0.685 m</output></div>
        <input id="cw-z" class="form-range" type="range" min="0.50" max="0.80" step="0.001" value="0.685" aria-label="Waypoint Z in metres">
      </div>
    </div>
    <div id="cw-coordinate" class="tabular-nums" aria-live="polite">Selected waypoint: [0.073, 0.237, 0.685] m</div>
    <div id="cw-chart">
      <svg class="cw-plot" role="img" aria-labelledby="cw-title cw-description">
        <title id="cw-title">A waypoint between reference grid lines</title>
        <desc id="cw-description">A three-dimensional coordinate diagram. A selected waypoint can lie between the five-centimetre reference grid lines. Change X, Y, or Z to choose a different point. The grid is for display; this does not run a robot or model.</desc>
        <g id="cw-marks"></g>
      </svg>
    </div>
    <div class="cw-legend text-small">
      <span class="cw-legend-item"><span class="cw-dot" aria-hidden="true"></span>Selected waypoint</span>
      <span class="cw-legend-item"><span class="cw-grid-key" aria-hidden="true"></span>5 cm reference grid · display only</span>
    </div>
  </div>
  <script>
  (() => {
    const root = document.getElementById('uc71-continuous-waypoints');
    const svg = root.querySelector('.cw-plot');
    const marks = root.querySelector('#cw-marks');
    const chart = root.querySelector('#cw-chart');
    const coordinate = root.querySelector('#cw-coordinate');
    const names = ['x', 'y', 'z'];
    const inputs = names.map(name => root.querySelector('#cw-' + name));
    const outputs = names.map(name => root.querySelector('#cw-' + name + '-value'));
    const point = [0.073, 0.237, 0.685];
    const limits = [[0, .3], [0, .3], [.5, .8]];
    const ns = 'http://www.w3.org/2000/svg';
    const raw = p => [(p[0] - p[1]) * Math.sqrt(3) / 2, .5 * (p[0] + p[1]) - (p[2] - .5)];
    const corners = [];
    for (const x of [0, .3]) for (const y of [0, .3]) for (const z of [.5, .8]) corners.push(raw([x, y, z]));
    const bounds = [0, 1].map(i => [Math.min(...corners.map(p => p[i])), Math.max(...corners.map(p => p[i]))]);
    function node(tag, attrs, text) {
      const el = document.createElementNS(ns, tag);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, String(value));
      if (text !== undefined) el.textContent = text;
      marks.appendChild(el);
      return el;
    }
    function draw() {
      const width = Math.max(chart.getBoundingClientRect().width, 280);
      const height = Math.max(290, Math.min(390, width * .62));
      svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
      svg.setAttribute('height', height);
      const scale = Math.min((width - 100) / (bounds[0][1] - bounds[0][0]), (height - 78) / (bounds[1][1] - bounds[1][0]));
      const ox = width / 2;
      const oy = height / 2;
      function project(p) { const q = raw(p); return [ox + q[0] * scale, oy + q[1] * scale]; }
      function line(a, b, attrs = {}) {
        const p = project(a), q = project(b);
        return node('line', {x1:p[0], y1:p[1], x2:q[0], y2:q[1], stroke:'var(--border)', 'stroke-width':1, ...attrs});
      }
      function label(p, text, dx = 0, dy = 0, anchor = 'middle') {
        const q = project(p);
        return node('text', {x:q[0]+dx, y:q[1]+dy, 'text-anchor':anchor}, text);
      }
      marks.replaceChildren();
      for (let i = 0; i <= 6; ++i) {
        const v = i * .05;
        line([v,0,.5],[v,.3,.5]);
        line([0,v,.5],[.3,v,.5]);
        if (i > 0) {
          line([0,0,.5+v],[.3,0,.5+v], {opacity:.55});
          line([0,0,.5+v],[0,.3,.5+v], {opacity:.55});
        }
      }
      line([.3,0,.5],[.3,0,.8], {opacity:.55});
      line([0,.3,.5],[0,.3,.8], {opacity:.55});
      const axisStyle = {stroke:'var(--muted-foreground)', 'stroke-width':1.4};
      line([0,0,.5],[.3,0,.5],axisStyle);
      line([0,0,.5],[0,.3,.5],axisStyle);
      line([0,0,.5],[0,0,.8],axisStyle);
      label([.3,0,.5],'X (m)',12,31);
      label([0,.3,.5],'Y (m)',-12,31);
      label([0,0,.8],'Z (m)',0,-14);
      for (const v of [.1,.2,.3]) {
        label([v,0,.5],v.toFixed(1),4,16);
        label([0,v,.5],v.toFixed(1),-4,16);
      }
      for (const z of [.5,.6,.7,.8]) label([0,0,z],z.toFixed(1),-8,4,'end');
      const [x,y,z] = point;
      const guide = {stroke:'var(--viz-series-1)', 'stroke-width':1.4, 'stroke-dasharray':'4 4', opacity:.6};
      line([x,y,.5],point,guide);
      line([x,0,.5],[x,y,.5],guide);
      line([0,y,.5],[x,y,.5],guide);
      const foot = project([x,y,.5]);
      node('circle',{cx:foot[0],cy:foot[1],r:3,fill:'var(--viz-series-1)',opacity:.45});
      const end = project(point);
      node('circle',{cx:end[0],cy:end[1],r:7,fill:'var(--viz-series-1)',stroke:'var(--background)','stroke-width':2});
      const targetName = label(point,'Waypoint',end[0] > width/2 ? -12 : 12,-12,end[0] > width/2 ? 'end' : 'start');
      const box = targetName.getBBox();
      if (box.x < 4 || box.x+box.width > width-4) targetName.setAttribute('text-anchor','middle');
      root.querySelector('#cw-description').textContent = 'Selected waypoint at X ' + x.toFixed(3) + ', Y ' + y.toFixed(3) + ', Z ' + z.toFixed(3) + ' metres. Dashed projections show its position between the five-centimetre reference lines. This is an illustration, not a robot rollout.';
    }
    function display(announce) {
      inputs.forEach((input, i) => { input.value = point[i]; outputs[i].value = point[i].toFixed(3) + ' m'; });
      if (announce) coordinate.textContent = 'Selected waypoint: [' + point.map(v => v.toFixed(3)).join(', ') + '] m';
      draw();
    }
    function restore(saved) {
      const p = saved && saved.modelContent && saved.modelContent.waypoint_m;
      if (Array.isArray(p) && p.length === 3 && p.every((v,i) => typeof v === 'number' && Number.isFinite(v) && v >= limits[i][0] && v <= limits[i][1])) {
        p.forEach((v,i) => { point[i] = v; });
      }
      display(true);
    }
    inputs.forEach((input, i) => {
      input.addEventListener('input', () => { point[i] = Number(input.value); display(false); });
      input.addEventListener('change', () => {
        display(true);
        if (window.openai && window.openai.setWidgetState) {
          Promise.resolve(window.openai.setWidgetState({modelContent:{waypoint_m:point.slice(), illustrative:true, reference_grid_m:.05, controller_grid_snapping:false},privateContent:null})).catch(() => {});
        }
      });
    });
    restore(window.openai && window.openai.widgetState);
    window.addEventListener('openai:set_globals', event => {
      const globals = event.detail && event.detail.globals;
      if (globals && Object.prototype.hasOwnProperty.call(globals,'widgetState')) restore(globals.widgetState);
    });
    new ResizeObserver(draw).observe(chart);
  })();
  </script>
</div>
