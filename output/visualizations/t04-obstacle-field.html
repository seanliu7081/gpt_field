        const value=query(field,p), alpha=value===null ? .19 : .035+.57*Math.min(1,value/maxValue), color=value===null?mask:fg;
        const k=4*(row*n+col);for(let j=0;j<3;j++) img.data[k+j]=Math.round(bg[j]*(1-alpha)+color[j]*alpha);img.data[k+3]=255;
        if(value===null) masked.push([col,row]);
      }
      ctx.putImageData(img,0,0);element(group,'image',{x:left,y:top,width:side,height:side,href:c.toDataURL(),'image-rendering':'pixelated'});
      const cell=side/n;
      masked.forEach(([col,row])=>element(group,'rect',{x:left+col*cell,y:top+row*cell,width:cell+.1,height:cell+.1,fill:'url(#of-mask-hatch)'}));
      const boxRect=(box,attrs)=>{
        if(z<box.lower_xyz_m[2] || z>box.upper_xyz_m[2]) return;
        element(group,'rect',{x:x(box.lower_xyz_m[0]),y:y(box.upper_xyz_m[1]),width:x(box.upper_xyz_m[0])-x(box.lower_xyz_m[0]),height:y(box.lower_xyz_m[1])-y(box.upper_xyz_m[1]),fill:'none',...attrs});
      };
      s.routing.expanded_boxes.forEach(box=>boxRect(box,{stroke:'var(--viz-series-3)','stroke-width':1.5}));
      s.original_boxes.forEach(box=>boxRect(box,{stroke:'var(--muted-foreground)','stroke-width':1}));
      const path=(points,attrs)=>element(group,'polyline',{points:points.map(p=>`${x(p[0])},${y(p[1])}`).join(' '),fill:'none',...attrs});
      path(s.routing.path_xyz_m,{stroke:'var(--viz-series-1)','stroke-width':3});
      path(s.measured_path_xyz_m,{stroke:'var(--viz-series-2)','stroke-width':2,'stroke-dasharray':'5 4'});
      const start=s.entry_xyz_m, goal=s.goal_xyz_m, gx=x(goal[0]),gy=y(goal[1]);
      element(group,'circle',{cx:x(start[0]),cy:y(start[1]),r:4,fill:'var(--viz-series-1)'});
      element(group,'polygon',{points:`${gx},${gy-5} ${gx+5},${gy} ${gx},${gy+5} ${gx-5},${gy}`,fill:'var(--viz-series-1)'});
      element(sliceMarks,'rect',{'data-chart-frame':'',x:left,y:top,width:side,height:side,fill:'none',stroke:'var(--border)','stroke-width':1});
      for(let i=0;i<4;i++) {
        const t=i/3, xv=field.low[0]+t*(field.high[0]-field.low[0]),yv=field.low[1]+t*(field.high[1]-field.low[1]);
        element(sliceMarks,'text',{x:x(xv),y:top+side+18,'text-anchor':i===0?'start':i===3?'end':'middle'},fmt(xv));
        element(sliceMarks,'text',{x:left-8,y:y(yv)+4,'text-anchor':'end'},fmt(yv));
      }
      element(sliceMarks,'text',{class:'axis-title','data-axis':'x',x:left+side/2,y:top+side+39,'text-anchor':'middle'},'世界 X（m）');
      element(sliceMarks,'text',{class:'axis-title','data-axis':'y',x:14,y:top+side/2,transform:`rotate(-90 14 ${top+side/2})`,'text-anchor':'middle'},'世界 Y（m）');
      const barY=top+side+57, barWidth=Math.min(side*.45,130);
      for(let i=0;i<40;i++) element(sliceMarks,'rect',{x:left+i*barWidth/40,y:barY,width:barWidth/40+.2,height:8,fill:'var(--viz-series-1)','fill-opacity':.035+.57*i/39});
      element(sliceMarks,'text',{x:left,y:barY+23},'0');element(sliceMarks,'text',{x:left+barWidth,y:barY+23,'text-anchor':'end'},maxValue.toFixed(1));
      element(sliceMarks,'text',{x:left+barWidth+12,y:barY+8},'目标吸引代价');
      const overlay=element(sliceMarks,'rect',{x:left,y:top,width:side,height:side,fill:'transparent','data-chart-hit':'','aria-label':'查询当前位置的场值'});
      overlay.addEventListener('pointermove',showQuery);overlay.addEventListener('pointerleave',()=>tooltip.style.display='none');overlay.addEventListener('pointerdown',showQuery);
      slice.dataset.maskedSamples=String(masked.length);
    }
    function showQuery(event) {
      const bounds=slice.getBoundingClientRect(), px=event.clientX-bounds.left,py=event.clientY-bounds.top;
      const p=[field.low[0]+(px-sliceFrame.left)/sliceFrame.side*(field.high[0]-field.low[0]),field.high[1]-(py-sliceFrame.top)/sliceFrame.side*(field.high[1]-field.low[1]),z];
      const value=query(field,p), blocked=field.boxes.some(b=>isInside(p,b));
      tooltip.textContent=`[${p.map(fmt).join(', ')}] m · ${value===null?(blocked?'障碍扩张区：不可行':'插值边界：不可行'):`代价 ${value.toFixed(3)}`}`;
      tooltip.style.display='block';const rr=root.getBoundingClientRect();
      tooltip.style.left=`${Math.max(0,Math.min(event.clientX-rr.left+12,rr.width-tooltip.offsetWidth))}px`;
      tooltip.style.top=`${Math.max(0,event.clientY-rr.top-tooltip.offsetHeight-12)}px`;
    }
    function draw(){heightOutput.textContent=`z = ${fmt(z)} m`;tooltip.style.display='none';drawScene();drawSlice();}
    select.addEventListener('change',()=>{setStage(Number(select.value));save();});
    heightInput.addEventListener('input',()=>{z=Number(heightInput.value);draw();});heightInput.addEventListener('change',save);
    root.querySelector('#of-rotate').addEventListener('click',()=>{yaw+=Math.PI/2;drawScene();save();});
    scene.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY,yaw,pitch};scene.setPointerCapture(event.pointerId);});
    scene.addEventListener('pointermove',event=>{if(!drag)return;yaw=drag.yaw+(event.clientX-drag.x)*.009;pitch=Math.max(.2,Math.min(1.3,drag.pitch-(event.clientY-drag.y)*.007));drawScene();});
    scene.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});scene.addEventListener('pointercancel',()=>drag=null);
    new ResizeObserver(()=>draw()).observe(root.querySelector('.of-views'));
    new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)stateFromHost(event.detail.globals.widgetState);});
    stateFromHost(window.openai?.widgetState);
  })();
  </script>
