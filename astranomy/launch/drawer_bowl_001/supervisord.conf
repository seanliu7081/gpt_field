[unix_http_server]
file=/workspace/gpt_field/astranomy/launch/drawer_bowl_001/control.sock
chmod=0600

[supervisord]
logfile=/workspace/gpt_field/astranomy/launch/drawer_bowl_001/supervisord.log
pidfile=/workspace/gpt_field/astranomy/launch/drawer_bowl_001/supervisord.pid
childlogdir=/workspace/gpt_field/astranomy/launch/drawer_bowl_001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///workspace/gpt_field/astranomy/launch/drawer_bowl_001/control.sock

[program:astranomy_drawer]
command=/workspace/gpt_field/.venv/bin/python -u -m astranomy.run --run --approved-full-test --output /workspace/gpt_field/astranomy/runs/drawer_bowl_001
directory=/workspace/gpt_field
environment=PYTHONPATH="/workspace/gpt_field/src:/workspace/gpt_field",PYTHONDONTWRITEBYTECODE="1",PROC_NAME="astranomy_drawer"
autostart=true
autorestart=false
startsecs=0
startretries=0
stopsignal=INT
stopwaitsecs=240
stopasgroup=false
killasgroup=false
redirect_stderr=true
stdout_logfile=/workspace/gpt_field/astranomy/launch/drawer_bowl_001/runner.log
stdout_logfile_maxbytes=0
